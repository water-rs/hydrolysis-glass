name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: ["**"]
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_TERM_COLOR: always

jobs:
  bump:
    # release-plz bump pull requests (`release-plz-*` heads) change only
    # versions and the changelog, so this job skips itself and every other
    # job skips through `needs: bump`.
    name: Not a release bump
    if: ${{ !startsWith(github.head_ref, 'release-plz-') }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "${GITHUB_HEAD_REF:-$GITHUB_REF_NAME} is not a release bump"

  check:
    name: Check / ${{ matrix.os }}
    needs: bump
    runs-on: ${{ matrix.os }}
    # A passing Windows run takes about 25 minutes.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig1-dev libva-dev libpipewire-0.3-dev libegl-dev libgbm-dev libwayland-dev libxkbcommon-dev libvulkan-dev mesa-vulkan-drivers
      - name: Install DirectX Shader Compiler
        if: runner.os == 'Windows'
        uses: tracel-ai/github-actions/install-dxc@295f2fdbae5271f4f8ad56d634e4ff6a95daafc8
      - uses: Swatinem/rust-cache@v2
      - if: runner.os == 'Linux'
        run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - uses: taiki-e/install-action@nextest
      # Cargo 1.100's build-dir layout writes each test binary into its own
      # `target/debug/build/hydrolysis-glass/<hash>/out/` directory instead
      # of `target/debug/deps`. Build the test binaries first so those
      # directories exist, and after `Swatinem/rust-cache` has finished any
      # target-directory cleanup, then stage the pinned current WARP
      # (water-rs/waterui#3093) into each of them before running the suite.
      - name: Build test binaries
        if: runner.os == 'Windows'
        id: test-dirs
        shell: pwsh
        run: |
          cargo nextest run --locked --no-run
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $dirs = @(Get-ChildItem target\debug\build\hydrolysis-glass\*\out -Directory |
            ForEach-Object { $_.FullName })
          if ($dirs.Count -eq 0) {
            throw "No test output directories found under target\debug\build\hydrolysis-glass"
          }
          Add-Content -Path $env:GITHUB_OUTPUT -Value 'into<<EOF'
          Add-Content -Path $env:GITHUB_OUTPUT -Value $dirs
          Add-Content -Path $env:GITHUB_OUTPUT -Value 'EOF'
      - name: Install current WARP
        if: runner.os == 'Windows'
        uses: water-rs/waterui/.github/actions/install-warp@dev
        with:
          into: |
            target/debug/deps
            target/debug
            ${{ steps.test-dirs.outputs.into }}
      - run: cargo nextest run --locked
      - run: cargo test --locked --doc

  msrv:
    name: MSRV
    needs: bump
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The floor is whatever `Cargo.toml` declares, read here rather than
      # written twice: a hardcoded version in CI drifts from the manifest and
      # then gates a number nobody declared.
      - name: Read rust-version from Cargo.toml
        id: msrv
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)"
          if [ -z "$version" ]; then
            echo "::error::Cargo.toml declares no rust-version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # Installing a toolchain is not building with it: the action only
          # sets the rustup default, and this repository's
          # `rust-toolchain.toml` overrides the default for every cargo
          # invocation inside the checkout. `RUSTUP_TOOLCHAIN` is the one
          # override that beats the file.
          echo "RUSTUP_TOOLCHAIN=$version" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig1-dev libva-dev libpipewire-0.3-dev libegl-dev libgbm-dev libwayland-dev libxkbcommon-dev libvulkan-dev mesa-vulkan-drivers
      - uses: Swatinem/rust-cache@v2
      # Proof in the log that the floor is what compiled, so a later change to
      # the pin or the action cannot quietly make this a second stable run.
      - name: Show the toolchain this job builds with
        run: rustc --version && cargo --version
      # The shipped artifact is what MSRV bounds: dev-dependencies may
      # legitimately require newer, so check the package targets only.
      - run: cargo check --locked

  result:
    # The single check the `main` ruleset requires: it passes when every
    # job passed or was skipped (release-plz bump pull requests skip all).
    name: CI result
    if: always()
    needs: [bump, check, msrv]
    runs-on: ubuntu-latest
    steps:
      - name: Check job results
        env:
          RESULTS: ${{ join(needs.*.result, ', ') }}
          FAILED: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          echo "job results: $RESULTS"
          if [ "$FAILED" = "true" ]; then
            echo "::error::one or more jobs failed or were cancelled"
            exit 1
          fi
