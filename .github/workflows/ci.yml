name: CI

# Diagnostic only, never merged: times every pumped frame of one
# Hydrolysis-mounted test on Windows and prints the framework's logs.

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_TERM_COLOR: never

jobs:
  hang:
    name: Windows mounted-test timing
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install DirectX Shader Compiler
        uses: tracel-ai/github-actions/install-dxc@295f2fdbae5271f4f8ad56d634e4ff6a95daafc8
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - name: One mounted test, terminated after six minutes
        env:
          RUST_LOG: "warn,hydrolysis=debug,cherenkov_gpu=info,wgpu_hal=warn"
        run: >
          cargo nextest run --locked --no-capture -j 1 --test hydrolysis
          -E "test(a_mounted_glass_button_matches_the_standalone_surface)"
