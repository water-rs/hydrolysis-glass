name: CI

# Diagnostic only, never merged: the whole suite on Windows with the
# engine shader written straight through, every test bounded at four
# minutes.

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_TERM_COLOR: never
  RUST_LOG: "warn"

jobs:
  hang:
    name: Windows suite
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install DirectX Shader Compiler
        uses: tracel-ai/github-actions/install-dxc@295f2fdbae5271f4f8ad56d634e4ff6a95daafc8
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      # wgpu's instance takes `InstanceFlags::DEBUG` from `wgpu-types`'
      # own `debug_assertions`, and that flag makes DXC skip optimization;
      # turning only that crate's assertions off isolates the flag.
      - run: >
          cargo nextest run --locked --no-fail-fast
          --config "profile.dev.package.wgpu-types.debug-assertions=false"
          --config "profile.test.package.wgpu-types.debug-assertions=false"
