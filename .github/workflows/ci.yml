# diag/27-windows-hang only: never merged.
name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: diag-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_TERM_COLOR: never

jobs:
  diag:
    name: Diag / ${{ matrix.variant }}
    runs-on: windows-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        variant: [pr, engine-mip]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install DirectX Shader Compiler
        uses: tracel-ai/github-actions/install-dxc@295f2fdbae5271f4f8ad56d634e4ff6a95daafc8
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-latest
          save-if: false
      - if: matrix.variant == 'engine-mip'
        shell: bash
        run: cp diag/material_engine_dev.wgsl shaders/material_engine.wgsl
      - uses: taiki-e/install-action@nextest
      - name: Where dxcompiler.dll is
        shell: pwsh
        run: |
          Get-Command dxcompiler.dll -ErrorAction SilentlyContinue | Format-List
          Get-CimInstance Win32_VideoController | Format-List Name,DriverVersion,AdapterCompatibility
          Get-CimInstance Win32_Processor | Format-List Name,NumberOfCores,NumberOfLogicalProcessors
      - run: cargo nextest run --locked --no-run --test hydrolysis --test gpu
      - name: Hydrolysis tests, one at a time
        env:
          RUST_LOG: warn,wgpu_hal=info,wgpu_core=warn,hydrolysis=info
        run: cargo nextest run --locked --test hydrolysis --no-fail-fast -j 1 --no-capture
      - name: Standalone tests, one at a time
        if: always()
        run: cargo nextest run --locked --test gpu --no-fail-fast -j 1
