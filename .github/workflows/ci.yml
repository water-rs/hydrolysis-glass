name: CI

# Diagnostic only, never merged: runs the Hydrolysis-mounted tests one at a
# time on Windows and captures a minidump of each crash.

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "line-tables-only"
  CARGO_PROFILE_TEST_DEBUG: "line-tables-only"
  CARGO_TERM_COLOR: always

jobs:
  crash:
    name: Windows crash dump
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install DirectX Shader Compiler
        uses: tracel-ai/github-actions/install-dxc@295f2fdbae5271f4f8ad56d634e4ff6a95daafc8
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - name: Enable crash dumps
        shell: pwsh
        run: |
          $key = 'HKLM:\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps'
          New-Item -Path $key -Force | Out-Null
          New-Item -ItemType Directory -Force "$env:GITHUB_WORKSPACE\dumps" | Out-Null
          New-ItemProperty -Path $key -Name DumpFolder -Value "$env:GITHUB_WORKSPACE\dumps" -PropertyType ExpandString -Force | Out-Null
          New-ItemProperty -Path $key -Name DumpType -Value 1 -PropertyType DWord -Force | Out-Null
          New-ItemProperty -Path $key -Name DumpCount -Value 20 -PropertyType DWord -Force | Out-Null
      - name: Hydrolysis-mounted tests, one at a time
        continue-on-error: true
        env:
          RUST_BACKTRACE: "1"
        run: cargo nextest run --locked --no-fail-fast -j 1 --test hydrolysis
      - name: Crash stacks
        if: always()
        shell: pwsh
        run: |
          Get-ChildItem "$env:GITHUB_WORKSPACE\dumps"
          $cdb = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\Debuggers\x64\cdb.exe' -ErrorAction SilentlyContinue
          if (-not $cdb) { Write-Output 'cdb is not installed on this image'; exit 0 }
          Get-ChildItem "$env:GITHUB_WORKSPACE\dumps\*.dmp" | ForEach-Object {
            Write-Output "=== $($_.Name)"
            & $cdb.FullName -z $_.FullName -c '.ecxr; kb 60; q'
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-crash-dumps
          path: dumps
          if-no-files-found: warn
          retention-days: 3
