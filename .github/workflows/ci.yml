# diag/27-windows-hang only: never merged.
name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: diag-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_TERM_COLOR: never

jobs:
  diag:
    name: Diag / ${{ matrix.variant }}
    runs-on: windows-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        variant: [probe]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install DirectX Shader Compiler
        uses: tracel-ai/github-actions/install-dxc@295f2fdbae5271f4f8ad56d634e4ff6a95daafc8
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-latest
          save-if: false
      - if: matrix.variant != 'pr'
        shell: bash
        run: cp diag/variants/${{ matrix.variant }}/*.wgsl shaders/
      - uses: taiki-e/install-action@nextest
      - run: cargo nextest run --locked --no-run --test hydrolysis
      - name: Engine tests, one at a time
        env:
          RUST_LOG: warn
        run: cargo nextest run --locked --test hydrolysis --no-fail-fast -j 1 --no-capture -E 'test(a_material_group) | test(a_mounted)'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-${{ matrix.variant }}
          path: target/verification/*.png
