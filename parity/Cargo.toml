[workspace]
resolver = "2"

[package]
name = "hydrolysis_glass_parity"
version = "0.1.0"
edition = "2024"
authors = ["Lexo Liu"]
rust-version = "1.100"
publish = false

[lib]
crate-type = ["lib"]

[dependencies]
hydrolysis-glass = { path = "..", default-features = false, features = ["navigation", "picker", "slider", "stepper", "toggle", "text-field"] }
waterui = { default-features = false, features = ["navigation", "picker", "slider", "stepper", "toggle", "text-field"] , git = "https://github.com/water-rs/waterui", rev = "f2dbbc59b9332a32c7a312351625d10c54e64fa0" }

[target.'cfg(target_vendor = "apple")'.dependencies]
waterui-backend-core = { default-features = false, version = "0.5.2" }

[dev-dependencies]
waterui-testing = { default-features = false, features = ["gallery"] , git = "https://github.com/water-rs/waterui", rev = "f2dbbc59b9332a32c7a312351625d10c54e64fa0" }

[lints.rust]
missing_docs = "warn"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
correctness = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "warn"
multiple_crate_versions = "allow"

