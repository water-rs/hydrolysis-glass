[workspace]
resolver = "2"

[package]
name = "hydrolysis-glass"
version = "0.1.0"
edition = "2024"
authors = ["Lexo Liu"]
rust-version = "1.95"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/water-rs/hydrolysis-glass"
description = "Glass material widget theme for WaterUI Hydrolysis"
keywords = ["ui", "theme", "glass", "waterui", "graphics"]
categories = ["gui"]
include = ["src/**", "shaders/**", "README.md", "ENGINE_REQUIREMENTS.md", "LICENSE-*"]

[features]
default = []
# Rendering the material through the engine: Cherenkov `BackdropGroup`,
# shader paints and the `Backdrop` capability. Off until the engine ships
# them; `ENGINE_REQUIREMENTS.md` lists every API the gated code needs.
engine = []
# GPU→CPU readback and internal-texture access for the verification
# harness. Off for consumers: nothing may build a readback path on the
# runtime API.
verification = []

[dependencies]
bytemuck = { version = "1", features = ["derive"] }
hydrolysis = "0.3.1"
nami = "0.11.1"
vello = "0.9"
waterui = { version = "0.5.2", default-features = false }
waterui-backend-core = { version = "0.5.2", default-features = false, features = ["widgets", "gestures"] }
waterui-controls = "0.5.1"
waterui-core = "0.5.1"
waterui-form = "0.5.1"
wgpu = { version = "29.0.4", default-features = false, features = ["wgsl"] }

[dev-dependencies]
# The test harness exercises the `verification` surface.
hydrolysis-glass = { path = ".", version = "0.1.0", features = ["verification"] }
pollster = "1.0"
# Dumps the verification renders as PNG so a failing property can be looked at.
image = { version = "0.25.10", default-features = false, features = ["png"] }

[lints.rust]
missing_docs = "warn"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
correctness = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "warn"
multiple_crate_versions = "allow"

