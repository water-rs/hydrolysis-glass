wgpu-naga-bridge = { git = "https://github.com/water-rs/wgpu", rev = "4b35d8bc968f6968b3cbae65b6e2e2ee132aa038" }
wgpu-types = { git = "https://github.com/water-rs/wgpu", rev = "4b35d8bc968f6968b3cbae65b6e2e2ee132aa038" }

# Tests that render the material through the engine run the test binary
# through `cargo nextest run` (preferred) or `cargo test`. `cargo-nextest`
# stays a dev tool so a contributor builds with `cargo test` too.

# The verification scenes render through a software rasterizer: dependencies
# still build optimized in dev so the scene tests spend their time on the
# GPU work, not on unoptimized support code.
[profile.dev.package."*"]
opt-level = 3