[workspace]
resolver = "2"

[package]
name = "hydrolysis-glass"
version = "0.1.0"
edition = "2024"
authors = ["Lexo Liu"]
rust-version = "1.95"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/water-rs/hydrolysis-glass"
description = "Glass material widget theme for WaterUI Hydrolysis"
keywords = ["ui", "theme", "glass", "waterui", "graphics"]
categories = ["gui"]
include = ["src/**", "shaders/**", "README.md", "ENGINE_REQUIREMENTS.md", "LICENSE-*"]

[features]
default = []
# Rendering the material through the engine: the recorded
# `Content::record_layered` runs become Cherenkov `BackdropGroup`s whose
# members run the glass `backdrop_effect` shader. The feature adds the
# GPU engine (`cherenkov-gpu`) used by the crate's engine host — the
# theme's recording path itself needs no feature.
engine = ["dep:cherenkov-gpu"]
# GPU→CPU readback for the verification harness. Off for consumers:
# nothing may build a readback path on the runtime API.
verification = []

[dependencies]
bytemuck = { version = "1", features = ["derive"] }
# The engine's recording contract — `Draw`/`Recorder`, `Paint` and
# `WorkingColor`, `Shadow`, `Group`, and `kurbo` — reached through
# `cherenkov`'s re-exports so the theme's types are the engine's types.
cherenkov = "0.0.0"
# The material recording contract — `MaterialRegistry`,
# `Recorder::backdrop_material`, `MaterialEffect`, `CaptureClass` — lives
# in the moved layer-tree crate `cherenkov` does not re-export.
cherenkov-record = "0.0.0"
# The in-tree GPU engine behind the `engine` feature: the crate's engine
# host realizes layered recordings into `BackdropGroup`s on it.
cherenkov-gpu = { version = "0.0.0", optional = true }
hydrolysis = "0.3.1"
nami = "0.12"
waterui = { version = "0.5.2", default-features = false }
waterui-backend-core = { version = "0.5.2", default-features = false, features = ["widgets", "gestures"] }
waterui-controls = "0.5.1"
waterui-core = "0.5.1"
waterui-form = "0.5.1"
wgpu = { version = "30.0.1", default-features = false, features = ["wgsl"] }

[dev-dependencies]
# The test harness exercises the `verification` surface.
hydrolysis-glass = { path = ".", version = "0.1.0", features = ["verification"] }
pollster = "1.0"
tracing = "0.1"
# Writes the verification renders as PNG so a failing property can be looked at.
image = { version = "0.25.10", default-features = false, features = ["png"] }

[lints.rust]
missing_docs = "warn"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
correctness = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "warn"
multiple_crate_versions = "allow"

# Third-party forks the framework itself patches; a registry dependency does
# not carry its own patch table, so the ones this graph resolves are repeated
# here so it builds the same sources as water-rs/waterui at the pinned rev.
[patch.crates-io]
xcb = { git = "https://github.com/rust-x-bindings/rust-xcb", rev = "ae3b2cd080e78173223038ccbebdc644eaf4a9ad" }
block = { git = "https://github.com/Dicklesworthstone/rust-block", rev = "b39ae859d1ee8e8cb5eef6a516471f1578d26b96" }

# The framework revision this crate builds against: water-rs/waterui at
# `fa61878`, whose recording contract carries the backdrop materials this
# theme declares (water-rs/waterui#1788 and followers). `hydrolysis` moved
# into the repository at `backends/hydrolysis` and the
# `cherenkov`/`filtrate` engine family lives under `graphics/` (water-rs/
# waterui#1449), so every framework crate resolves to this one rev — a
# registry `waterui-core` beside the pinned sources gives two `View` traits
# in one graph.
waterui = { git = "https://github.com/water-rs/waterui", rev = "fa61878cf6f435893234ddeba67ca572191c323a" }
waterui-assets = { git = "https://github.com/water-rs/waterui", rev = "fa61878cf6f435893234ddeba67ca572191c323a" }
